<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zz</title>
  <meta name="description" content="Zz — links" />
  <style>
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:#fff;
      background:#080808;
      overflow-x:hidden;
    }
    body:before{
      content:"";
      position:fixed;inset:-20px;
      background:
        radial-gradient(circle at 50% 12%,rgba(120,120,120,.13),transparent 32%),
        radial-gradient(circle at 20% 85%,rgba(90,20,20,.10),transparent 28%);
      filter:blur(10px);
      pointer-events:none;
    }
    main{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px 18px;
      position:relative;
    }
    .card{
      width:min(100%,420px);
      text-align:center;
      padding:34px 22px 24px;
    }
    .avatar{
      width:112px;height:112px;border-radius:50%;
      object-fit:cover;
      border:1px solid rgba(255,255,255,.25);
      box-shadow:0 10px 45px rgba(0,0,0,.6);
      display:block;margin:0 auto 17px;
    }
    h1{margin:0;font-size:32px;letter-spacing:-1px;font-weight:700}
    .tag{margin:7px 0 28px;color:rgba(255,255,255,.5);font-size:14px}
    .links{display:grid;gap:12px}
    .link{
      display:flex;align-items:center;justify-content:center;gap:10px;
      min-height:58px;padding:14px 18px;border-radius:14px;
      color:#fff;text-decoration:none;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.09);
      backdrop-filter:blur(12px);
      transition:transform .18s ease,background .18s ease,border-color .18s ease;
      font-weight:600;
    }
    .link:hover{
      transform:translateY(-2px);
      background:rgba(255,255,255,.11);
      border-color:rgba(255,255,255,.2);
    }
    .icon{width:20px;text-align:center;opacity:.9}
    footer{margin-top:26px;color:rgba(255,255,255,.28);font-size:12px}
  </style>
</head>
<body>
  <main>
    <section class="card">
      <img class="avatar" src="profile.jpg" alt="Zz profile picture">
      <h1>Zz</h1>
      <p class="tag">@_.__zz_</p>

      <div class="links">
        <a class="link" href="https://discord.gg/exal" target="_blank" rel="noopener noreferrer">
          <span class="icon">✦</span> Discord
        </a>
        <a class="link" href="https://www.tiktok.com/@_.__zz_" target="_blank" rel="noopener noreferrer">
          <span class="icon">♪</span> TikTok
        </a>
      </div>

      <footer>© Zz</footer>
    </section>
  </main>
</body>
</html>
